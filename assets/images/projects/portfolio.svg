<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="pAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#pBg)"/>

  <!-- Browser Window Mockup -->
  <g transform="translate(100, 45)">
    <!-- Shadow -->
    <rect x="5" y="15" width="600" height="360" rx="16" fill="rgba(15, 23, 42, 0.1)"/>
    <!-- Window Body -->
    <rect width="600" height="360" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Window Top Header -->
    <rect width="600" height="42" rx="16" fill="#f1f5f9"/>
    <rect y="30" width="600" height="12" fill="#f1f5f9"/>
    <circle cx="25" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="21" r="5" fill="#10b981"/>

    <!-- Address Bar -->
    <rect x="120" y="10" width="360" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="300" y="25" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">https://bablu-portfolio.vercel.app</text>

    <!-- Content: Hero Layout Mockup -->
    <!-- Brand Logo -->
    <text x="35" y="75" fill="#0f172a" font-family="'Fira Code', monospace" font-size="14" font-weight="800">&lt;Bablu.dev/&gt;</text>

    <!-- Nav items -->
    <rect x="360" y="65" width="40" height="8" rx="4" fill="#94a3b8"/>
    <rect x="415" y="65" width="40" height="8" rx="4" fill="#94a3b8"/>
    <rect x="470" y="65" width="40" height="8" rx="4" fill="#94a3b8"/>
    <rect x="525" y="60" width="45" height="18" rx="9" fill="url(#pAccent)"/>

    <!-- Hero Left: Text Lines -->
    <text x="35" y="140" fill="#0f172a" font-family="sans-serif" font-size="28" font-weight="800">Hi, I'm Bablu Kumar</text>
    <text x="35" y="170" fill="#2563eb" font-family="sans-serif" font-size="15" font-weight="700">B.Tech CSE Student &amp; Full-Stack Developer</text>
    <rect x="35" y="195" width="280" height="8" rx="4" fill="#94a3b8" opacity="0.5"/>
    <rect x="35" y="212" width="240" height="8" rx="4" fill="#94a3b8" opacity="0.5"/>
    <rect x="35" y="229" width="200" height="8" rx="4" fill="#94a3b8" opacity="0.5"/>

    <!-- Hero Buttons -->
    <rect x="35" y="260" width="110" height="34" rx="8" fill="url(#pAccent)"/>
    <text x="90" y="282" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">View Projects</text>

    <rect x="155" y="260" width="110" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="210" y="282" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="600">Download CV</text>

    <!-- Hero Right: Avatar/Card Frame Mockup -->
    <rect x="380" y="115" width="180" height="200" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="470" cy="190" r="50" fill="url(#pAccent)" opacity="0.15"/>
    <circle cx="470" cy="190" r="42" fill="#2563eb" opacity="0.8"/>
    <!-- Avatar silhouette -->
    <circle cx="470" cy="180" r="16" fill="#ffffff"/>
    <path d="M448 212 a22 22 0 0 1 44 0 z" fill="#ffffff"/>
    <rect x="410" y="260" width="120" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="430" y="280" width="80" height="8" rx="4" fill="#94a3b8"/>
  </g>
</svg>
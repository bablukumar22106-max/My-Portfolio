<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="stockBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.35)"/>
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.0)"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#stockBg)"/>

  <!-- Subtle grid lines -->
  <line x1="80" y1="120" x2="720" y2="120" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <line x1="80" y1="180" x2="720" y2="180" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <line x1="80" y1="240" x2="720" y2="240" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <line x1="80" y1="300" x2="720" y2="300" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <line x1="80" y1="360" x2="720" y2="360" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>

  <!-- Header Card Header -->
  <rect x="80" y="45" width="640" height="60" rx="12" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="110" y="82" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">RELIANCE.NS • AI STOCK PREDICTOR</text>
  <rect x="470" y="62" width="105" height="26" rx="6" fill="rgba(16, 185, 129, 0.15)"/>
  <text x="522" y="80" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="700">▲ +3.42% PREDICTED</text>
  <text x="690" y="82" text-anchor="end" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="13" font-weight="600">Model: Linear Reg</text>

  <!-- Area under curve -->
  <path d="M 80 320 Q 150 280 200 300 T 320 220 T 440 250 T 560 170 T 660 190 T 720 140 L 720 370 L 80 370 Z" fill="url(#areaGrad)"/>

  <!-- Candlesticks (Decorative) -->
  <g opacity="0.6">
    <!-- Candle 1 -->
    <line x1="140" y1="260" x2="140" y2="320" stroke="#10b981" stroke-width="1.5"/>
    <rect x="135" y="275" width="10" height="30" fill="#10b981"/>
    <!-- Candle 2 -->
    <line x1="220" y1="280" x2="220" y2="330" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="215" y="290" width="10" height="25" fill="#ef4444"/>
    <!-- Candle 3 -->
    <line x1="300" y1="200" x2="300" y2="260" stroke="#10b981" stroke-width="1.5"/>
    <rect x="295" y="215" width="10" height="35" fill="#10b981"/>
    <!-- Candle 4 -->
    <line x1="380" y1="220" x2="380" y2="270" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="375" y="235" width="10" height="25" fill="#ef4444"/>
    <!-- Candle 5 -->
    <line x1="460" y1="180" x2="460" y2="240" stroke="#10b981" stroke-width="1.5"/>
    <rect x="455" y="195" width="10" height="30" fill="#10b981"/>
    <!-- Candle 6 -->
    <line x1="540" y1="140" x2="540" y2="210" stroke="#10b981" stroke-width="1.5"/>
    <rect x="535" y="155" width="10" height="40" fill="#10b981"/>
    <!-- Candle 7 -->
    <line x1="620" y1="160" x2="620" y2="220" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="615" y="175" width="10" height="30" fill="#ef4444"/>
    <!-- Candle 8 -->
    <line x1="700" y1="120" x2="700" y2="180" stroke="#10b981" stroke-width="1.5"/>
    <rect x="695" y="130" width="10" height="35" fill="#10b981"/>
  </g>

  <!-- Prediction Curve (Cyan-Green gradient glow line) -->
  <path d="M 80 320 Q 150 280 200 300 T 320 220 T 440 250 T 560 170 T 660 190 T 720 140" fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Target prediction pulse dot -->
  <circle cx="720" cy="140" r="7" fill="#10b981"/>
  <circle cx="720" cy="140" r="14" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6"/>

  <!-- Floating Metric Chips at bottom -->
  <rect x="100" y="380" width="160" height="45" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="115" y="408" fill="#94a3b8" font-family="sans-serif" font-size="12">Features: MA_5, MA_10</text>

  <rect x="280" y="380" width="180" height="45" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="295" y="408" fill="#38bdf8" font-family="sans-serif" font-size="12">Next Close: ₹2,940.50</text>

  <rect x="480" y="380" width="180" height="45" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(255, 255, 255, 0.1)"/>
  <text x="495" y="408" fill="#10b981" font-family="sans-serif" font-size="12">Train / Test Split: 80 / 20</text>
</svg>